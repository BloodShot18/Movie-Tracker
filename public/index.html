<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonight's Reel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181F;
    --paper: #EFE6D2;
    --paper-hi: #F4EEDD;
    --ink: #2A2318;
    --rule: #8C8267;
    --brass: #B8863A;
    --brass-bright: #D8A94E;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #E3DBC7;
      --paper: #FBF7EC;
      --paper-hi: #FFFDF6;
      --ink: #221D14;
      --rule: #A79A76;
      --brass: #A9762E;
      --brass-bright: #C6923F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181F; --paper:#EFE6D2; --paper-hi:#F4EEDD; --ink:#2A2318; --rule:#8C8267; --brass:#B8863A; --brass-bright:#D8A94E;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    color: var(--paper);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 100%;
    max-width: 640px;
    padding: 40px 20px 60px;
  }
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--paper);
    padding-bottom: 14px;
    margin-bottom: 4px;
  }
  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 38px);
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--paper);
  }
  .tally {
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--brass-bright);
    white-space: nowrap;
  }
  .sub {
    font-size: 13px;
    color: var(--rule);
    margin: 10px 0 14px;
    line-height: 1.5;
    max-width: 46ch;
  }
  .room-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--rule);
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .room-bar .room-name { color: var(--brass-bright); }
  .room-bar button.linklike {
    background: none;
    border: none;
    color: var(--brass-bright);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .room-bar input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    color: var(--paper);
    padding: 2px 4px;
    outline: none;
    width: 120px;
  }

  .ticket {
    background: var(--paper);
    color: var(--ink);
    padding: 20px;
    border-radius: 2px;
    position: relative;
    margin-bottom: 34px;
  }
  .ticket::before {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 0;
    border-bottom: 2px dashed var(--rule);
    opacity: 0.5;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rule);
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--rule);
    padding: 5px 2px 7px;
    color: var(--ink);
    outline: none;
  }
  .field input:focus { border-bottom-color: var(--brass); }
  .pill-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 6px 12px;
    border: 1.5px solid var(--rule);
    border-radius: 999px;
    cursor: pointer;
    background: transparent;
    color: var(--ink);
    user-select: none;
  }
  .pill[aria-pressed="true"] {
    background: var(--brass);
    border-color: var(--brass);
    color: var(--paper-hi);
  }
  .filter-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 10px;
    border: 1.5px solid var(--rule);
    border-radius: 999px;
    cursor: pointer;
    background: transparent;
    color: var(--paper);
    user-select: none;
  }
  .filter-pill[aria-pressed="true"] {
    background: var(--brass-bright);
    border-color: var(--brass-bright);
    color: var(--ink);
  }
  .noteinput {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--rule);
    padding: 5px 2px 7px;
    color: var(--ink);
    outline: none;
  }
  .noteinput:focus { border-bottom-color: var(--brass); }
  #room-code-field { display: none; }
  .punch {
    margin-top: 16px;
    width: 100%;
    background: var(--ink);
    color: var(--paper-hi);
    border: none;
    padding: 13px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    cursor: pointer;
    border-radius: 2px;
  }
  .punch:disabled { opacity: 0.5; cursor: not-allowed; }
  .punch:hover:not(:disabled) { background: var(--brass); }

  .genre-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .feed-head {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rule);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 8px;
    margin-bottom: 4px;
  }
  .entry {
    display: grid;
    grid-template-columns: 58px 1fr;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid rgba(140,130,103,0.35);
  }
  .entry-time {
    font-size: 12px;
    color: var(--brass-bright);
    padding-top: 2px;
  }
  .entry-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--paper);
    line-height: 1.3;
  }
  .entry-del {
    background: none;
    border: none;
    color: var(--rule);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-style: normal;
    cursor: pointer;
    margin-left: 8px;
    padding: 0 4px;
    line-height: 1;
    vertical-align: middle;
  }
  .entry-del:hover { color: var(--brass-bright); }
  .entry-del:disabled { opacity: 0.4; cursor: not-allowed; }
  .entry-meta {
    font-size: 11.5px;
    color: var(--rule);
    margin-top: 4px;
  }
  .entry-meta .kind-tag {
    color: var(--brass-bright);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .entry-meta .watched-count {
    color: var(--rule);
  }
  .entry-note {
    font-size: 12.5px;
    color: var(--rule);
    margin-top: 6px;
    font-style: italic;
  }
  .empty {
    padding: 40px 0;
    text-align: center;
    color: var(--rule);
    font-size: 13px;
    line-height: 1.6;
  }
  .footer-note {
    margin-top: 30px;
    font-size: 11px;
    color: var(--rule);
    text-align: center;
    line-height: 1.6;
  }
  @media (max-width: 420px) {
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="masthead">
    <h1>Tonight's Reel</h1>
    <div class="tally" id="tally">— this week</div>
  </div>
  <p class="sub">A shared log of what everyone's been watching this past week. Punch in a title when you finish it — the ledger below fills in live for anyone with the page open.</p>

  <div class="room-bar" id="room-bar">
    <span>Viewing: <span class="room-name" id="room-label">Public</span></span>
    <button class="linklike" id="room-switch-btn" type="button">Enter a room →</button>
    <span id="room-entry-box" style="display:none;">
      <input id="room-code-input" type="text" maxlength="40" placeholder="room code">
      <button class="linklike" id="room-go-btn" type="button">Go</button>
    </span>
  </div>

  <div class="ticket">
    <div class="row2">
      <div class="field">
        <label for="f-name">Your name</label>
        <input id="f-name" type="text" maxlength="30" placeholder="Rhea">
      </div>
      <div class="field">
        <label for="f-title">Title</label>
        <input id="f-title" type="text" maxlength="80" placeholder="Paris, Texas">
      </div>
    </div>
    <div class="field">
      <label>What kind</label>
      <div class="pill-group" id="kind-group">
        <button class="pill" data-value="Movie" aria-pressed="true" type="button">Movie</button>
        <button class="pill" data-value="Episode" aria-pressed="false" type="button">Episode</button>
        <button class="pill" data-value="Series" aria-pressed="false" type="button">Series</button>
      </div>
    </div>
    <div class="field">
      <label>Genre</label>
      <div class="pill-group" id="genre-group"></div>
    </div>
    <div class="field">
      <label>Visibility</label>
      <div class="pill-group" id="visibility-group">
        <button class="pill" data-value="public" aria-pressed="true" type="button">Public</button>
        <button class="pill" data-value="private" aria-pressed="false" type="button">Private (room)</button>
      </div>
    </div>
    <div class="field" id="room-code-field">
      <label for="f-room">Room code</label>
      <input id="f-room" type="text" maxlength="40" placeholder="roommates47">
    </div>
    <div class="field">
      <label for="f-note">One line, optional</label>
      <input class="noteinput" id="f-note" type="text" maxlength="90" placeholder="long overdue rewatch">
    </div>
    <button class="punch" id="punch-btn" type="button">Log it →</button>
  </div>

  <div class="genre-filter" id="genre-filter"></div>

  <div class="feed-head">
    <span>Logged this week</span>
    <span id="feed-count">0 entries</span>
  </div>
  <div id="feed"></div>
  <p class="footer-note" id="status-note">Connecting to the shared ledger…</p>
</div>

<script>
(function () {
  var GENRES = ["Drama", "Comedy", "Action", "Thriller", "Horror", "Sci-Fi", "Romance", "Documentary", "Animation", "Other"];

  var kind = "Movie";
  var genre = "Other";
  var visibility = "public";
  var filterGenre = "";
  var room = "";

  try { room = localStorage.getItem("watchlog_room") || ""; } catch (e) {}

  function wirePillGroup(groupEl, onChange, defaultValue) {
    groupEl.addEventListener("click", function (e) {
      var b = e.target.closest(".pill");
      if (!b) return;
      Array.from(groupEl.children).forEach(function (c) {
        c.setAttribute("aria-pressed", c === b ? "true" : "false");
      });
      onChange(b.dataset.value);
    });
  }

  var kindGroup = document.getElementById("kind-group");
  wirePillGroup(kindGroup, function (v) { kind = v; });

  var visGroup = document.getElementById("visibility-group");
  var roomCodeField = document.getElementById("room-code-field");
  wirePillGroup(visGroup, function (v) {
    visibility = v;
    roomCodeField.style.display = v === "private" ? "block" : "none";
  });

  var genreGroup = document.getElementById("genre-group");
  genreGroup.innerHTML = GENRES.map(function (g, i) {
    return '<button class="pill" data-value="' + g + '" aria-pressed="' + (i === GENRES.length - 1 ? "true" : "false") + '" type="button">' + g + '</button>';
  }).join("");
  wirePillGroup(genreGroup, function (v) { genre = v; });

  var genreFilterEl = document.getElementById("genre-filter");
  genreFilterEl.innerHTML = '<button class="filter-pill" data-value="" aria-pressed="true" type="button">All genres</button>' +
    GENRES.map(function (g) {
      return '<button class="filter-pill" data-value="' + g + '" aria-pressed="false" type="button">' + g + '</button>';
    }).join("");
  genreFilterEl.addEventListener("click", function (e) {
    var b = e.target.closest(".filter-pill");
    if (!b) return;
    Array.from(genreFilterEl.children).forEach(function (c) {
      c.setAttribute("aria-pressed", c === b ? "true" : "false");
    });
    filterGenre = b.dataset.value;
    load();
  });

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  var DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  function timeStr(ts) {
    var d = new Date(ts);
    var h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? "p" : "a";
    h = h % 12; if (h === 0) h = 12;
    var isToday = d.toDateString() === new Date().toDateString();
    var prefix = isToday ? "" : DAY_NAMES[d.getDay()] + " ";
    return prefix + h + ":" + String(m).padStart(2, "0") + ap;
  }
  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  var feedEl = document.getElementById("feed");
  var tallyEl = document.getElementById("tally");
  var countEl = document.getElementById("feed-count");
  var statusEl = document.getElementById("status-note");
  var btn = document.getElementById("punch-btn");
  var nameEl = document.getElementById("f-name");
  var titleEl = document.getElementById("f-title");
  var noteEl = document.getElementById("f-note");
  var roomInputEl = document.getElementById("f-room");

  var roomLabelEl = document.getElementById("room-label");
  var roomSwitchBtn = document.getElementById("room-switch-btn");
  var roomEntryBox = document.getElementById("room-entry-box");
  var roomCodeInput = document.getElementById("room-code-input");
  var roomGoBtn = document.getElementById("room-go-btn");

  function refreshRoomBar() {
    if (room) {
      roomLabelEl.textContent = "Room \"" + room + "\"";
      roomSwitchBtn.textContent = "← Back to public";
    } else {
      roomLabelEl.textContent = "Public";
      roomSwitchBtn.textContent = "Enter a room →";
    }
    roomEntryBox.style.display = "none";
  }
  refreshRoomBar();

  roomSwitchBtn.addEventListener("click", function () {
    if (room) {
      room = "";
      try { localStorage.removeItem("watchlog_room"); } catch (e) {}
      refreshRoomBar();
      load();
    } else {
      roomEntryBox.style.display = roomEntryBox.style.display === "none" ? "inline-flex" : "none";
    }
  });
  roomGoBtn.addEventListener("click", function () {
    var code = roomCodeInput.value.trim();
    if (!code) return;
    room = code;
    try { localStorage.setItem("watchlog_room", room); } catch (e) {}
    refreshRoomBar();
    load();
  });

  function render(entries) {
    countEl.textContent = entries.length + (entries.length === 1 ? " entry" : " entries");
    tallyEl.textContent = entries.length + " this week";
    if (entries.length === 0) {
      feedEl.innerHTML = '<div class="empty">Nothing logged this week yet.<br>Be the first to punch in.</div>';
      return;
    }
    feedEl.innerHTML = entries.map(function (e) {
      var watched = e.watchedCount ? ' · watched ' + e.watchedCount + '×' : '';
      return '<div class="entry" data-id="' + escapeHtml(e.id) + '">' +
        '<div class="entry-time">' + timeStr(e.createdAt) + '</div>' +
        '<div>' +
          '<div class="entry-title">' + escapeHtml(e.title) +
            '<button class="entry-del" data-id="' + escapeHtml(e.id) + '" title="Delete this entry" type="button">&times;</button>' +
          '</div>' +
          '<div class="entry-meta">' + escapeHtml(e.name) + ' — <span class="kind-tag">' + escapeHtml(e.kind) + '</span>' +
            (e.genre ? ' · ' + escapeHtml(e.genre) : '') +
            '<span class="watched-count">' + watched + '</span>' +
          '</div>' +
          (e.note ? '<div class="entry-note">' + escapeHtml(e.note) + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join("");
  }

  feedEl.addEventListener("click", function (e) {
    var delBtn = e.target.closest(".entry-del");
    if (!delBtn) return;
    var id = delBtn.dataset.id;
    if (!confirm("Delete this entry?")) return;
    delBtn.disabled = true;
    fetch("/api/entries/" + encodeURIComponent(id), { method: "DELETE" })
      .then(function (r) {
        if (!r.ok) throw new Error("status " + r.status);
        load();
      })
      .catch(function () {
        statusEl.textContent = "Couldn't delete that entry. Try again.";
        delBtn.disabled = false;
      });
  });

  var POLL_MS = 6000;
  var pollTimer = null;

  function load() {
    var params = new URLSearchParams();
    if (room) params.set("room", room);
    if (filterGenre) params.set("genre", filterGenre);
    fetch("/api/entries?" + params.toString())
      .then(function (r) {
        if (!r.ok) throw new Error("status " + r.status);
        return r.json();
      })
      .then(function (data) {
        render(data.entries || []);
        statusEl.textContent = "Showing the last 7 days.";
      })
      .catch(function () {
        statusEl.textContent = "Couldn't reach the ledger API. Check the API is deployed.";
      });
  }

  btn.addEventListener("click", function () {
    var name = nameEl.value.trim();
    var title = titleEl.value.trim();
    var note = noteEl.value.trim();
    var roomCode = roomInputEl.value.trim();
    if (!name || !title) {
      statusEl.textContent = "Add your name and a title before logging it.";
      return;
    }
    if (visibility === "private" && !roomCode) {
      statusEl.textContent = "Add a room code, or switch to Public.";
      return;
    }
    btn.disabled = true;
    fetch("/api/entries", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        name: name, title: title, kind: kind, note: note, day: todayStr(),
        genre: genre, visibility: visibility,
        room_code: visibility === "private" ? roomCode : ""
      })
    })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.error || ("status " + r.status)); });
        return r.json();
      })
      .then(function () {
        titleEl.value = "";
        noteEl.value = "";
        statusEl.textContent = "Logged. Keep going.";
        btn.disabled = false;
        titleEl.focus();
        if (visibility === "private" && roomCode && !room) {
          room = roomCode;
          try { localStorage.setItem("watchlog_room", room); } catch (e) {}
          refreshRoomBar();
        }
        load();
      })
      .catch(function (err) {
        statusEl.textContent = "Couldn't log that (" + err.message + "). Try again.";
        btn.disabled = false;
      });
  });

  render([]);
  load();
  pollTimer = setInterval(load, POLL_MS);
})();
</script>
</body>
</html>
